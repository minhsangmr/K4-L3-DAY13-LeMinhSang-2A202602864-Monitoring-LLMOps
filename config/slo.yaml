service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Baseline hệ thống ghi nhận P95 latency ~158ms và TTFT P95 ~54ms. Ngưỡng SLO latency <= 3000ms được chọn để bảo đảm phát hiện kịp thời các sự cố tắc nghẽn (như RAG delay ~2500ms). Với 10,000 request trong cửa sổ 28 ngày, mục tiêu SLO 99.5% tương ứng Error Budget 0.5%, cho phép tối đa 50 request bị chậm hoặc lỗi.

guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
